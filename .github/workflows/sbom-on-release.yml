name: sbom-on-release

# Regenerates the SBOM set under sbom/ (CycloneDX 1.5 + SPDX 2.3, source and
# built-image views, OSV vulnerability and license enrichment, SHA-256 manifest)
# whenever a release tag is pushed, attaches it to the release and opens a pull
# request that refreshes the committed copy. See sbom/README.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      malcolm_version:
        description: 'Image tag to scan (default: the tag in docker-compose.yml)'
        required: false
        type: string

permissions:
  contents: read

env:
  SYFT_VERSION: 1.54.1
  SYFT_SHA256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47
  OSV_SCANNER_VERSION: 2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b

jobs:
  sbom:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      -
        name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      -
        name: Install syft and osv-scanner (pinned, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o syft.tgz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tgz" | sha256sum -c -
          tar -xzf syft.tgz syft && sudo install -m 0755 syft /usr/local/bin/syft && rm -f syft syft.tgz
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner && rm -f osv-scanner
          syft version
          osv-scanner --version
      -
        name: Generate SBOM set
        shell: bash
        env:
          MALCOLM_VERSION: ${{ inputs.malcolm_version }}
          SBOM_OPERATOR: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # An empty MALCOLM_VERSION lets generate.sh read the tag from docker-compose.yml,
          # which is what the release ships.
          [[ -n "${MALCOLM_VERSION}" ]] || unset MALCOLM_VERSION
          sbom/generate.sh
          (cd sbom && sha256sum -c --quiet SHA256SUMS)
          echo "malcolm_version=$(jq -r .malcolm_version sbom/provenance.json)" >> "$GITHUB_ENV"
      -
        name: Upload SBOM set as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: malcolm-sbom-${{ env.malcolm_version }}
          path: sbom/
          if-no-files-found: error
      -
        name: Attach SBOM set to the GitHub release
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            tar -czf "malcolm-sbom-${malcolm_version}.tar.gz" sbom
            gh release upload "${GITHUB_REF_NAME}" "malcolm-sbom-${malcolm_version}.tar.gz" sbom/SHA256SUMS sbom/summary.md sbom/provenance.json --clobber
          else
            echo "No GitHub release for ${GITHUB_REF_NAME}; SBOM set is available as the workflow artifact only."
          fi
      -
        name: Open pull request refreshing sbom/
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- sbom && [[ -z "$(git status --porcelain -- sbom)" ]]; then
            echo "sbom/ unchanged"; exit 0
          fi
          branch="sbom/refresh-${GITHUB_REF_NAME}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add sbom
          git commit -m "sbom: regenerate for ${GITHUB_REF_NAME} (Malcolm ${malcolm_version})"
          git push origin "${branch}"
          cat > pr-body.md <<EOF
          Automated SBOM refresh for \`${GITHUB_REF_NAME}\` (Malcolm images \`${malcolm_version}\`), generated by the sbom-on-release workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.

          Files: CycloneDX 1.5 + SPDX 2.3 per deployable (source and built views), OSV results, vulns.csv, licenses.csv, provenance.json, summary.md, SHA256SUMS. See sbom/README.md.
          EOF
          gh pr create --base main --head "${branch}" \
            --title "sbom: regenerate for ${GITHUB_REF_NAME}" \
            --body-file pr-body.md
