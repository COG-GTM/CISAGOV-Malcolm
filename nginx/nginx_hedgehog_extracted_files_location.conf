#
# Body of the "/hh-extracted-files/<sensor>/<path>" location (included from nginx.conf and
# nginx_readonly.conf) which proxies extracted-file downloads from a Hedgehog Linux sensor.
# The enclosing location regex captures $2 = sensor hostname/IP from the URL and $3 = the
# path requested on the sensor. Because $2 comes from the URL, only sensors listed in
# NGINX_HEDGEHOG_EXTRACTED_FILES_HOSTS (rendered into the $hh_extracted_files_host_allowed map
# by docker_entrypoint.sh) may be contacted, the Malcolm user's credentials are never forwarded,
# and responses are treated as untrusted content. See GHSA-j89q-3q7m-8vr6.
include /etc/nginx/nginx_auth_rt.conf;
limit_except GET { deny all; }

set $hh_extracted_files_host $2;
set $hh_extracted_files_path $3;
if ($hh_extracted_files_host_allowed != 1) {
  return 403;
}
rewrite ^/(dashboards/app/)?hh-extracted-files/([a-zA-Z0-9-\.]+)(.*)$ $hh_extracted_files_path break;

proxy_pass https://$hh_extracted_files_host:8006;
include /etc/nginx/nginx_hedgehog_extracted_files_ssl_rt.conf;
proxy_redirect off;
proxy_set_header Host $hh_extracted_files_host;
proxy_set_header X-Malcolm-Forward "/hh-extracted-files/$hh_extracted_files_host";

# the sensor authenticates Malcolm by source address (its reachback ACL), not by the
# user's credentials: strip them from the request and ignore any cookies it tries to set
proxy_set_header Authorization "";
proxy_set_header Cookie "";
proxy_hide_header Set-Cookie;

# extracted files may be malware: force everything except directory listings to download
# (preserving the sensor's filename), forbid MIME sniffing, and render listings in an
# opaque-origin sandbox so nothing served through this route can run as the Malcolm origin
proxy_hide_header Content-Disposition;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
add_header Content-Disposition $hh_extracted_files_disposition always;
add_header X-Content-Type-Options nosniff always;
add_header Content-Security-Policy "sandbox allow-downloads; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
