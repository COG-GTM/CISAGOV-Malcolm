#
# http-level maps used by nginx_hedgehog_extracted_files_location.conf. The host allowlist map
# ($hh_extracted_files_host_allowed) is generated at startup into conf.d by
# hedgehog_extracted_files_config.sh from NGINX_HEDGEHOG_EXTRACTED_FILES_HOSTS.

# directory listings (paths ending in "/") are rendered; everything else is downloaded
map $hh_extracted_files_path $hh_extracted_files_is_listing {
  default 0;
  "~/$"   1;
}

# Content-Disposition sent to the browser: none for listings; otherwise the sensor's own
# "attachment; filename=..." header if it sent one (so ZIP/encrypted downloads keep their
# names), and a bare "attachment" for anything else
map "$hh_extracted_files_is_listing:$upstream_http_content_disposition" $hh_extracted_files_disposition {
  default                        "attachment";
  "~^1:"                         "";
  "~*^0:attachment(\s*;.*)?$"    $upstream_http_content_disposition;
}
